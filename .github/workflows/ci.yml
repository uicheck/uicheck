name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:

jobs:
  javascript:
    name: JavaScript packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace dependencies
        run: pnpm run prepare:workspace

      - name: Typecheck
        run: |
          pnpm --filter @uicheck/core run typecheck
          pnpm --filter @uicheck/mcp run typecheck
          pnpm --filter @uicheck/web run typecheck
          pnpm --filter @uicheck/taro run typecheck
          pnpm --filter @uicheck/rn run typecheck

      - name: Test
        run: |
          pnpm --filter @uicheck/core run test
          pnpm --filter @uicheck/mcp run test
          pnpm --filter @uicheck/web run test
          pnpm --filter @uicheck/taro run test
          pnpm --filter @uicheck/rn run test

      - name: Build
        run: |
          pnpm --filter @uicheck/core run build
          pnpm --filter @uicheck/mcp run build
          pnpm --filter @uicheck/web run build
          pnpm --filter @uicheck/taro run build
          pnpm --filter @uicheck/rn run build
          pnpm --filter @uicheck/site run build

      - name: Generate rendered runtime evidence
        run: pnpm run test:evidence:browser

      - name: Upload JavaScript runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-runtime-test-evidence
          path: |
            packages/web/build/uicheck-test-artifacts/**
            packages/rn/build/uicheck-test-artifacts/**

  taro-weapp:
    name: Taro WeApp runtime evidence
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache WeChat Developer Tools
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/uicheck/wechatwebdevtools-2.01.2510290-darwin-arm64.dmg
          key: wechatwebdevtools-2.01.2510290-darwin-arm64

      - name: Install WeChat Developer Tools
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if [ -x /Applications/wechatwebdevtools.app/Contents/MacOS/cli ]; then
            /Applications/wechatwebdevtools.app/Contents/MacOS/cli --version || true
            exit 0
          fi
          version="2.01.2510290"
          arch="$(uname -m)"
          if [ "$arch" = "arm64" ]; then
            devtools_arch="arm64"
            expected_sha="555d6a36fc128ab1eb3b5e9bc72ad8a1a5825e962e285180e51803d8d4dde9b5"
          else
            devtools_arch="x64"
            expected_sha="344e15fcdd442b0d6a7add9802380cedd42f1bd4303f1f0c1291caade3583cb2"
          fi
          cache_dir="$HOME/Library/Caches/uicheck"
          dmg="$cache_dir/wechatwebdevtools-${version}-darwin-${devtools_arch}.dmg"
          mkdir -p "$cache_dir"
          if [ ! -f "$dmg" ]; then
            curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --progress-bar \
              "https://dldir1.qq.com/WechatWebDev/release/be1ec64cf6184b0fa64091919793f068/wechat_devtools_${version}_darwin_${devtools_arch}.dmg" \
              --output "$dmg"
          fi
          echo "${expected_sha}  ${dmg}" | shasum -a 256 --check
          mount_dir="$RUNNER_TEMP/wechatwebdevtools"
          rm -rf "$mount_dir"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mount_dir"
          rm -rf /Applications/wechatwebdevtools.app
          ditto "$mount_dir/wechatwebdevtools.app" /Applications/wechatwebdevtools.app
          hdiutil detach "$mount_dir" -quiet
          xattr -dr com.apple.quarantine /Applications/wechatwebdevtools.app || true
          /Applications/wechatwebdevtools.app/Contents/MacOS/cli --version || true

      - name: Reset WeChat Developer Tools
        run: |
          /Applications/wechatwebdevtools.app/Contents/MacOS/cli quit || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm exec playwright install chromium

      - name: Generate real Taro WeApp runtime evidence
        run: pnpm run test:evidence:taro-weapp

      - name: Upload Taro WeApp runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taro-weapp-runtime-test-evidence
          path: |
            packages/taro/build/uicheck-test-artifacts/**

  android:
    name: Android native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm --filter uicheck_android run typecheck

      - name: Test
        run: pnpm --filter uicheck_android run test

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-test-evidence
          path: |
            packages/android/build/uicheck-test-artifacts/**
            packages/android/build/reports/**

  flutter:
    name: Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Analyze
        run: pnpm --filter uicheck_flutter run typecheck

      - name: Test
        run: pnpm --filter uicheck_flutter run test

      - name: Build verification
        run: pnpm --filter uicheck_flutter run build

      - name: Upload Flutter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-evidence
          path: |
            packages/flutter/build/uicheck-test-artifacts/**

  apple:
    name: Apple native
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        working-directory: packages/apple
        run: swift build

      - name: Test
        working-directory: packages/apple
        run: swift test

      - name: Upload Apple evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-native-test-evidence
          path: |
            packages/apple/.build/uicheck-test-artifacts/**
            packages/apple/.build/**/*.xctest

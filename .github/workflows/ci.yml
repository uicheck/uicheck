name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:

jobs:
  javascript:
    name: JavaScript packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace dependencies
        run: pnpm run prepare:workspace

      - name: Typecheck
        run: |
          pnpm --filter @uicheck/core run typecheck
          pnpm --filter @uicheck/mcp run typecheck
          pnpm --filter @uicheck/web run typecheck
          pnpm --filter @uicheck/taro run typecheck
          pnpm --filter @uicheck/rn run typecheck
          pnpm --filter UICheckRNDemo run typecheck

      - name: Unit tests
        run: |
          pnpm --filter @uicheck/core run test
          pnpm --filter @uicheck/mcp run test
          pnpm --filter @uicheck/web run test
          pnpm --filter @uicheck/taro run test
          pnpm --filter @uicheck/rn run test
          pnpm --filter UICheckRNDemo run test:snapshot

      - name: Build
        run: |
          pnpm --filter @uicheck/core run build
          pnpm --filter @uicheck/mcp run build
          pnpm --filter @uicheck/web run build
          pnpm --filter @uicheck/taro run build
          pnpm --filter @uicheck/rn run build
          pnpm --filter @uicheck/site run build

      - name: Upload JavaScript evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-test-evidence
          path: |
            packages/web/build/uicheck-test-artifacts/**
            packages/rn/build/uicheck-test-artifacts/**
            examples/rn-native-demo/build/uicheck-test-artifacts/**

  taro-weapp:
    name: Taro WeApp snapshot evidence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm --filter @uicheck/taro run typecheck
          pnpm --filter taro-demo run typecheck

      - name: Verify real Taro WeApp UICheck snapshot
        run: pnpm run test:evidence:taro-weapp

      - name: Upload Taro WeApp snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taro-weapp-snapshot-test-evidence
          path: |
            packages/taro/src/__snapshots__/**
            packages/taro/build/uicheck-test-artifacts/**
            examples/taro-demo/dist/pages/index/index.js
            examples/taro-demo/dist/pages/index/index.wxml

  android:
    name: Android native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm --filter uicheck_android run typecheck

      - name: Verify Android package
        run: pnpm --filter uicheck_android run test

      - name: Verify real Android demo
        run: ../../packages/android/gradlew -p . :app:testDebugUnitTest :app:assembleDebug
        working-directory: examples/android-demo

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-test-evidence
          path: |
            packages/android/build/uicheck-test-artifacts/**
            examples/android-demo/app/build/uicheck-test-artifacts/**
            packages/android/build/reports/**

  flutter:
    name: Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Analyze
        run: pnpm --filter uicheck_flutter run typecheck

      - name: Verify Flutter package
        run: pnpm --filter uicheck_flutter run test

      - name: Analyze Flutter demo app
        working-directory: examples/flutter-demo
        run: flutter pub get && flutter analyze

      - name: Verify real Flutter demo
        working-directory: examples/flutter-demo
        run: flutter test

      - name: Build verification
        run: pnpm --filter uicheck_flutter run build

      - name: Upload Flutter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-evidence
          path: |
            packages/flutter/build/uicheck-test-artifacts/**
            examples/flutter-demo/build/uicheck-test-artifacts/**

  apple:
    name: Apple native
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/apple
        run: swift build

      - name: Verify Apple package
        working-directory: packages/apple
        run: swift test

      - name: Verify real Apple demo app
        run: swift test
        working-directory: examples/apple-demo

      - name: Upload Apple evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-native-test-evidence
          path: |
            packages/apple/.build/uicheck-test-artifacts/**
            examples/apple-demo/.build/uicheck-test-artifacts/**
            packages/apple/.build/**/*.xctest

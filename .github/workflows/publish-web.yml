name: Publish Web

on:
  push:
    tags:
      - 'web-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm run prepare:workspace

      - name: Typecheck
        run: pnpm --filter @uicheck/web run typecheck

      - name: Test
        run: pnpm --filter @uicheck/web run test

      - name: Build
        run: pnpm --filter @uicheck/web run build

      - name: Publish to npm
        working-directory: packages/web
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --title "@uicheck/web ${GITHUB_REF_NAME#web-}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
